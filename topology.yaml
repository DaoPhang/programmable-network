# topology.yaml — a small network described as data.
# build_topo.py reads this file and creates exactly this network in Mininet.
#
# Make it yours first (see "Your addresses" in the lab):
#   6042 = the last 4 digits of your student ID, e.g. 4207
#   42   = the last 2 digits, without a leading zero, e.g. 7
# Replace every 6042 and 42 below. Don't put your full student ID here: this file
# goes in your repository, which may be public.

student_id_last4: "6042"

switches:
  - s1
  - s2

hosts:
  - name: h1
    ip: 10.42.0.1/24
    ipv6: fd00:6042::1/64
  - name: h2
    ip: 10.42.0.2/24
    ipv6: fd00:6042::2/64
  - name: h3
    ip: 10.42.0.3/24
    ipv6: fd00:6042::3/64

  - name: h4
    ip: 10.42.0.4/24
    ipv6: fd00:6042::4/64

# Each link joins two nodes.
links:
  - [h1, s1]
  - [h2, s1]
  - [h3, s1]


  - [h4, s2]
  - [s1, s2]

